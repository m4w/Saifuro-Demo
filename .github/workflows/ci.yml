name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Match the npm that writes package-lock.json locally. Node 22 ships npm 10,
      # which rejects lock files from npm 11 (missing optional @emnapi/* entries).
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - name: Unit and component tests
        run: npm test
      - name: End-to-end tests (chain mocked)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
